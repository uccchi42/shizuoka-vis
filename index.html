<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静岡県における都市機能の分断 - データ可視化</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <header class="dashboard-header">
        <div class="header-top">
            <span class="badge">データビジュアライゼーション</span>
            <div class="legend-inline">
                <span><i class="dot color-west"></i>西部（ものづくり・ファミリー層）</span>
                <span><i class="dot color-mid"></i>中部（県庁所在地・都市機能）</span>
                <span><i class="dot color-izu"></i>伊豆・東部（観光・移住・超高齢化）</span>
            </div>
        </div>
        <h1>静岡県における都市機能の分断</h1>
        <p class="subtitle">人口規模では見えない「伊豆・東部の超高齢化」と「中西部のファミリー層」の二極化</p>
    </header>

    <main class="dashboard-main">
        <div class="container">
            <!-- 左側：静岡県マップ -->
            <div id="map-container" class="chart-box">
                <div class="chart-header">
                    <h2>静岡県 地域別マップ</h2>
                    <span class="chart-tip">市町ホバーで詳細表示 / 散布図と連動</span>
                </div>
                <div class="svg-wrapper">
                    <svg id="map-chart" viewBox="0 0 540 460" preserveAspectRatio="xMidYMid meet"></svg>
                </div>
            </div>

            <!-- 右側：散布図エリア（2D / 3D 切り替え） -->
            <div id="scatter-container" class="chart-box">
                <div class="chart-header">
                    <h2>データ分析散布図</h2>
                    <span class="chart-tip" id="graph-tip">点にホバーして自治体名・詳細データを確認</span>
                </div>
                
                <!-- グラフ切り替えボタン -->
                <div class="view-controls">
                    <span class="control-label">分析視点:</span>
                    <button class="view-btn active" onclick="switchGraphMode('3d')">3D 立体表示</button>
                    <button class="view-btn highlight-btn" onclick="switchGraphMode('elderly_single')">2D: 高齢化率 × 単独世帯（二極化を分析）</button>
                    <button class="view-btn" onclick="switchGraphMode('pop_elderly')">2D: 人口規模 × 高齢化率</button>
                    <button class="view-btn" onclick="switchGraphMode('pop_single')">2D: 人口規模 × 単独世帯割合</button>
                </div>

                <div id="scatter-chart" style="width:100%; height:460px;"></div>
            </div>
        </div>
    </main>

    <div class="tooltip" id="tooltip"></div>

    <footer class="source-info">
        <span>出典：SSDSE-A-2026（独立行政法人統計センター）</span>
        <span>URL: <a href="https://www.nstac.go.jp/use/literacy/ssdse/" target="_blank" rel="noopener noreferrer">https://www.nstac.go.jp/use/literacy/ssdse/</a></span>
    </footer>

    <script src="main.js"></script>
</body>
</html>
